steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/neon-airway-224101/://github.com', '.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/neon-airway-224101/://github.com']

- name: 'gcr.io/cloud-builders/gke-deploy'
  args:
  - 'run'
  - '--filename=./deployment-1.yaml'
  - '--image=gcr.io/neon-airway-224101/://github.com'
  - '--location=us-central1'
  - '--cluster=gke-deployment-cluster'

# Add this section at the end of the file:
options:
  logging: CLOUD_LOGGING_ONLY

